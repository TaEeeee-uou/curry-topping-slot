<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トッピングスロット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Serif+SC:wght@500;700&family=Fraunces:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0C0D12;
  --surface:#14161E;
  --surface-2:#1B1E29;
  --surface-3:#232733;
  --text:#F4F1EA;
  --muted:#8B8F9B;
  --faint:#5A5E6A;
  --line:rgba(244,241,234,.08);
  --line-2:rgba(244,241,234,.16);
  --accent:#F2B544;
  --accent-soft:rgba(242,181,68,.16);
  --font-serif:'Shippori Mincho B1','Fraunces','Hiragino Mincho ProN','Yu Mincho',serif;
  --font-sans:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
  --font-latin:'Outfit','Zen Kaku Gothic New',sans-serif;
  --row:82px;
  --reels:3;
  color-scheme:dark;
}
html[lang="zh"]{--font-serif:'Noto Serif SC','Fraunces','PingFang SC','Songti SC',serif;--font-sans:'Zen Kaku Gothic New','PingFang SC','Microsoft YaHei',sans-serif}
html[lang="en"],html[lang="ms"]{--font-serif:'Fraunces','Shippori Mincho B1',Georgia,serif}
@media (min-width:600px){ :root{--row:96px} }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:var(--ink);
  background-image:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(242,181,68,.10), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(127,182,230,.06), transparent 70%);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---- header ---- */
.top{
  max-width:680px;margin:0 auto;
  padding:calc(22px + env(safe-area-inset-top)) 22px 4px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;
}
.eyebrow{
  display:block;font-family:var(--font-latin);font-size:11px;font-weight:500;letter-spacing:.28em;
  color:var(--accent);text-transform:uppercase;
}
h1{
  font-family:var(--font-serif);font-weight:500;
  font-size:clamp(24px,5.5vw,32px);line-height:1.2;
  margin:6px 0 0;letter-spacing:.06em;text-wrap:balance;
}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line-2);background:transparent;
  color:var(--text);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;
  cursor:pointer;letter-spacing:.04em;transition:background .15s,border-color .15s,opacity .15s,color .15s;
}
.btn:hover{background:rgba(244,241,234,.06);border-color:rgba(244,241,234,.3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.btn.primary:hover{background:#f7c25f}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:rgba(244,241,234,.05)}
.btn.danger{color:#f28b7d;border-color:rgba(240,138,122,.3)}
.btn.danger:hover{background:rgba(240,138,122,.12)}
.btn[aria-pressed="false"]{color:var(--faint);text-decoration:line-through}
.sel{
  appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);background:transparent;
  color:var(--text);border-radius:999px;padding:8px 30px 8px 14px;font-size:13px;font-weight:500;cursor:pointer;letter-spacing:.02em;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238B8F9B' stroke-width='1.5'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.sel:hover{border-color:rgba(244,241,234,.3)}
.sel option{background:var(--surface);color:var(--text)}

/* ---- stage ---- */
.stage{
  max-width:680px;margin:0 auto;
  padding:14px 18px calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:22px;
}

/* ---- cabinet ---- */
.cabinet{
  width:min(100%,600px);
  background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
  border:1px solid var(--line);
  border-radius:28px;
  padding:22px 18px 20px;
  box-shadow:0 40px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  margin-top:10px;
  position:relative;
  transition:box-shadow .5s;
}
.cabinet.tense{box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(242,181,68,.25), 0 0 60px rgba(242,181,68,.12), inset 0 1px 0 rgba(255,255,255,.05)}

.reels{
  position:relative;
  display:grid;grid-template-columns:repeat(var(--reels),minmax(0,1fr));gap:10px;
}
.reels::before,.reels::after{
  content:"";position:absolute;top:calc(var(--row) * 1.5 - 5px);width:0;height:0;z-index:4;
  border-top:5px solid transparent;border-bottom:5px solid transparent;
}
.reels::before{left:-13px;border-left:7px solid var(--accent)}
.reels::after{right:-13px;border-right:7px solid var(--accent)}

.reel{
  position:relative;height:calc(var(--row) * 3);overflow:hidden;
  border-radius:18px;background:var(--ink);
  border:1px solid var(--line);
  box-shadow:inset 0 18px 30px rgba(0,0,0,.7), inset 0 -18px 30px rgba(0,0,0,.7);
  cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
  transition:box-shadow .4s,border-color .4s;
}
.reel.done{cursor:default}
.reel.tense{border-color:rgba(242,181,68,.5);box-shadow:inset 0 18px 30px rgba(0,0,0,.7), inset 0 -18px 30px rgba(0,0,0,.7), 0 0 30px rgba(242,181,68,.25);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 18px 30px rgba(0,0,0,.7), inset 0 -18px 30px rgba(0,0,0,.7), 0 0 50px rgba(242,181,68,.45)}}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel.fast .strip{filter:blur(.7px)}
.row{height:var(--row);padding:4px 7px}
.row>span{
  display:flex;align-items:center;justify-content:center;text-align:center;
  height:100%;width:100%;border-radius:12px;padding:2px 6px;
  font-family:var(--font-serif);font-weight:700;line-height:1.2;
  font-size:20px;letter-spacing:.04em;
  color:var(--c);
  background:color-mix(in srgb, var(--c) 10%, var(--surface-2));
  border:1px solid color-mix(in srgb, var(--c) 22%, transparent);
  overflow-wrap:break-word;text-wrap:balance;
  transition:background .35s,color .35s,box-shadow .35s,transform .35s;
}
.row>span.m{font-size:17px}
.row>span.s{font-size:14px;letter-spacing:.01em}
.row>span.xs{font-size:12.5px;letter-spacing:0;line-height:1.15}
@media (max-width:599px){
  .reels[data-count="4"] .row>span{font-size:15px;letter-spacing:.01em}
  .reels[data-count="4"] .row>span.m{font-size:13px}
  .reels[data-count="4"] .row>span.s{font-size:11.5px}
  .reels[data-count="4"] .row>span.xs{font-size:10.5px}
}
@media (min-width:600px){
  .row>span{font-size:23px}
  .row>span.m{font-size:19px}
  .row>span.s{font-size:16px}
  .row>span.xs{font-size:14px}
}
.row.win>span{
  background:var(--c);color:var(--ink);border-color:transparent;
  box-shadow:0 0 0 1px rgba(255,255,255,.15) inset, 0 6px 30px color-mix(in srgb, var(--c) 45%, transparent);
  transform:scale(1.03);
}
.reel::before,.reel::after{
  content:"";position:absolute;left:0;right:0;height:calc(var(--row) * .95);pointer-events:none;z-index:2;
}
.reel::before{top:0;background:linear-gradient(180deg,rgba(12,13,18,.95),rgba(12,13,18,0))}
.reel::after{bottom:0;background:linear-gradient(0deg,rgba(12,13,18,.95),rgba(12,13,18,0))}

.reel-tools{
  display:grid;grid-template-columns:repeat(var(--reels),minmax(0,1fr));gap:10px;margin-top:10px;min-height:28px;
}
.reel-tools .btn{
  padding:4px 4px;font-size:11.5px;white-space:nowrap;letter-spacing:.04em;
  border-color:transparent;color:var(--muted);width:100%;overflow:hidden;text-overflow:ellipsis;
}
.reel-tools .btn:hover{color:var(--text);background:rgba(244,241,234,.05)}
.reel-tools .btn:disabled{opacity:.35;color:var(--muted);background:transparent}

.controls{display:flex;justify-content:center;margin-top:14px}
.start{
  appearance:none;cursor:pointer;
  min-width:min(100%,280px);padding:15px 36px;border-radius:999px;
  border:1px solid var(--accent);
  background:var(--accent);
  color:var(--ink);font-family:var(--font-sans);font-weight:700;font-size:17px;letter-spacing:.2em;
  box-shadow:0 10px 30px rgba(242,181,68,.25);
  transition:transform .12s,box-shadow .2s,background .2s,color .2s;
}
html[lang="en"] .start,html[lang="ms"] .start{font-family:var(--font-latin);letter-spacing:.22em;font-size:16px}
.start:hover{background:#f7c25f;transform:translateY(-1px);box-shadow:0 14px 34px rgba(242,181,68,.32)}
.start:active{transform:translateY(1px)}
.start.stop{background:transparent;color:var(--accent);box-shadow:none}
.start.stop:hover{background:var(--accent-soft)}
.start:disabled{opacity:.45;cursor:default;transform:none}

.hint{
  margin:0;text-align:center;font-size:13.5px;color:var(--muted);
  min-height:1.7em;text-wrap:balance;letter-spacing:.02em;max-width:560px;
}
.hint strong{color:var(--text);font-weight:500}

/* ---- outcome ---- */
.outcome{
  width:min(100%,600px);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  animation:rise .5s cubic-bezier(.2,1,.3,1) both;
}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.picks{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 14px;
  font-family:var(--font-serif);font-weight:700;font-size:clamp(24px,6.4vw,38px);line-height:1.2;letter-spacing:.04em;
}
.picks .pk{color:var(--c);overflow-wrap:break-word}
.picks .x{color:var(--faint);font-family:var(--font-latin);font-weight:400;font-size:.55em}
.tag{margin:0;color:var(--muted);font-size:13.5px;letter-spacing:.04em}
.outcome .row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.outcome .btn{padding:11px 22px;font-size:14px}

.meta{
  display:flex;gap:18px;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}
.meta b{color:var(--text);font-weight:500;font-size:14px;font-family:var(--font-latin)}
.last{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);max-width:600px}
.chip{
  display:inline-block;padding:3px 11px;border-radius:999px;
  border:1px solid var(--line-2);color:var(--text);font-size:12px;letter-spacing:.03em;
}

/* ---- confetti ---- */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

/* ---- settings drawer ---- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.panel{
  position:fixed;top:0;right:0;bottom:0;z-index:31;
  width:min(100%,420px);background:var(--surface);
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  animation:slide .3s cubic-bezier(.2,.9,.3,1) both;
  box-shadow:-30px 0 80px rgba(0,0,0,.5);
}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel header{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(18px + env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid var(--line);
}
.panel h2{font-family:var(--font-serif);font-weight:500;font-size:18px;margin:0;letter-spacing:.06em}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 4px;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--muted);
  border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500;cursor:pointer;
  font-variant-numeric:tabular-nums;transition:background .15s,color .15s;
}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--ink);font-weight:700}
.panel form{display:flex;gap:8px;padding:12px 20px 6px}
.panel input[type=text]{
  flex:1;min-width:0;border:1px solid var(--line-2);background:var(--ink);
  color:var(--text);border-radius:12px;padding:10px 13px;font-size:15px;
}
.panel input[type=text]::placeholder{color:var(--faint)}
.panel input[type=text]:focus{outline:none;border-color:var(--accent)}
.list{list-style:none;margin:0;padding:6px 12px 10px;overflow-y:auto;flex:1}
.list li{border-radius:12px}
.list li:hover{background:rgba(244,241,234,.04)}
.list .main{display:flex;align-items:center;gap:10px;padding:9px 8px}
.list li.off .nm{color:var(--faint);text-decoration:line-through}
.list label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0}
.list input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;letter-spacing:.02em}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.mini{
  appearance:none;border:0;background:transparent;color:var(--faint);
  font-size:12px;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;
}
.mini:hover{color:var(--text);background:rgba(244,241,234,.06)}
.mini.del:hover{color:#f28b7d;background:rgba(240,138,122,.12)}
.mini[aria-expanded="true"]{color:var(--accent)}
.tr{
  display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
  padding:4px 10px 12px 40px;font-size:12px;color:var(--muted);
}
.tr input{
  border:1px solid var(--line-2);background:var(--ink);color:var(--text);
  border-radius:9px;padding:6px 10px;font-size:14px;min-width:0;width:100%;
}
.tr input:focus{outline:none;border-color:var(--accent)}
.panel footer{
  display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;
  padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);
}
.msg{padding:0 20px;font-size:12px;color:var(--muted);min-height:1.7em}

@media (prefers-reduced-motion: reduce){
  .outcome,.panel,.reel.tense{animation:none}
  .reel.fast .strip{filter:none}
  .row>span{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div>
    <span class="eyebrow">Topping Slot</span>
    <h1 data-t="title">トッピングスロット</h1>
  </div>
  <div class="actions">
    <select class="sel" id="langSel" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ms">Bahasa Melayu</option>
    </select>
    <button class="btn ghost" id="soundBtn" aria-pressed="true" data-t="sound">効果音</button>
    <button class="btn" id="settingsBtn" data-t="edit">トッピングを編集</button>
  </div>
</header>

<main class="stage">
  <section class="cabinet" id="cabinet">
    <div class="reels" id="reels"></div>
    <div class="reel-tools" id="reelTools"></div>
    <div class="controls">
      <button class="start" id="startBtn">スタート</button>
    </div>
  </section>

  <p class="hint" id="hint"></p>

  <section class="outcome" id="outcome" hidden aria-live="polite">
    <span class="eyebrow" data-t="today">今日のトッピング</span>
    <div class="picks" id="picks"></div>
    <p class="tag" id="tag"></p>
    <div class="row-btns">
      <button class="btn" id="againBtn" data-t="again">もう一回</button>
      <button class="btn primary" id="okBtn" data-t="ok">これにする</button>
    </div>
  </section>

  <div class="meta" id="meta"></div>
  <div class="last" id="last" hidden></div>
</main>

<canvas id="confetti" hidden></canvas>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden>
  <header>
    <h2 data-t="edit">トッピングを編集</h2>
    <button class="btn ghost" id="closeBtn" data-t="close">閉じる</button>
  </header>
  <div class="field">
    <span data-t="howMany">選ぶ数</span>
    <div class="seg" id="reelSeg" role="group">
      <button data-r="2" aria-pressed="false">2</button>
      <button data-r="3" aria-pressed="true">3</button>
      <button data-r="4" aria-pressed="false">4</button>
    </div>
  </div>
  <form id="addForm">
    <input type="text" id="addInput" maxlength="24" autocomplete="off">
    <button class="btn primary" type="submit" data-t="add">追加</button>
  </form>
  <p class="msg" id="msg"></p>
  <ul class="list" id="list"></ul>
  <footer>
    <span data-t="noDup">同じトッピングは重複しません</span>
    <div style="display:flex;gap:6px">
      <button class="btn ghost" id="allOnBtn" data-t="allOn">すべてON</button>
      <button class="btn danger" id="resetBtn" data-t="reset">はじめの候補に戻す</button>
    </div>
  </footer>
</aside>

<script>

    const cand = pickTargets(r.n, 1, others.concat([r.target]));
    if (!cand.length) { setHint('hintNoOther'); return; }
    ensureAudio();
    outcome.hidden = true;
    r.rerolling = true;
    setDone(r, false);
    r.phase = 'spin'; r.vel = 5; r.target = cand[0]; r.bounce = 0; r.lastTick = -1; r.last = false;
    r.stopAt = performance.now() + MAX_SPIN;
    updateTools();
    spinStartedAt = performance.now();
    settingsBtn.disabled = true;
    startBtn.textContent = t('stop'); startBtn.classList.add('stop');
    setHint('hintReroll');
    startLoop();
  }
  function onAllStopped() {
    cabinet.classList.remove('tense');
    reels.forEach(r => r.el.classList.remove('fast', 'tense'));
    startBtn.textContent = t('start'); startBtn.classList.remove('stop'); startBtn.disabled = false;
    settingsBtn.disabled = false;
    spinStartedAt = 0;
    updateTools();
    if (!allDone()) return;
    tagIdx = Math.floor(Math.random() * STR[lang].tags.length);
    renderPicks();
    outcome.hidden = false;
    setHint('hintDone');
    fanfare(); confetti();
  }
  function renderPicks() {
    picksEl.innerHTML = '';
    reels.forEach((r, i) => {
      if (i) { const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; picksEl.appendChild(x); }
      const s = document.createElement('span'); s.className = 'pk';
      s.style.setProperty('--c', colorAt(r.target, r.n));
      s.textContent = nameOf(r.list[r.target]); picksEl.appendChild(s);
    });
    const tags = STR[lang].tags; tagEl.textContent = tags[tagIdx % tags.length];
  }
  $('againBtn').addEventListener('click', start);
  $('okBtn').addEventListener('click', () => {
    const set = reels.map(r => r.list[r.target]);
    history.unshift(set); history = history.slice(0, 4);
    renderLast();
    setHint('hintDecided', { set });
    outcome.hidden = true; stopConfetti();
  });
  startBtn.addEventListener('click', start);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !panel.hidden) closePanel();
    if (e.key === ' ' && panel.hidden && !['INPUT', 'BUTTON', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); start(); }
  });
  function renderLast() {
    if (!history.length) { lastEl.hidden = true; return; }
    lastEl.hidden = false;
    lastEl.innerHTML = esc(t('earlier')) + ' ' + history.map(set => `<span class="chip">${set.map(it => esc(nameOf(it))).join(' × ')}</span>`).join('');
  }

  // ---- sound ----
  let ac = null, lastTickAt = 0;
  function ensureAudio() {
    if (!soundOn) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function tick() {
    const a = ensureAudio(); if (!a) return;
    const now = a.currentTime;
    if (now - lastTickAt < 0.045) return; lastTickAt = now;
    const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'triangle'; o.frequency.setValueAtTime(2200, now); o.frequency.exponentialRampToValueAtTime(1200, now + 0.03);
    f.type = 'highpass'; f.frequency.value = 900;
    g.gain.setValueAtTime(0.05, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
    o.connect(f).connect(g).connect(a.destination); o.start(now); o.stop(now + 0.05);
  }
  const NOTES = [329.63, 392.0, 493.88, 587.33];
  function thunk(i) {
    const a = ensureAudio(); if (!a) return;
    const now = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(70, now + 0.14);
    g.gain.setValueAtTime(0.16, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    o.connect(g).connect(a.destination); o.start(now); o.stop(now + 0.2);
    const o2 = a.createOscillator(), g2 = a.createGain();
    o2.type = 'sine'; o2.frequency.value = NOTES[i % NOTES.length] * 2;
    g2.gain.setValueAtTime(0.0001, now); g2.gain.exponentialRampToValueAtTime(0.08, now + 0.01); g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
    o2.connect(g2).connect(a.destination); o2.start(now); o2.stop(now + 0.75);
  }
  function fanfare() {
    const a = ensureAudio(); if (!a) return;
    const base = a.currentTime + 0.12;
    [659.25, 783.99, 987.77, 1318.5].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const s = base + i * 0.09;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.09, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + (i === 3 ? 1.2 : 0.5));
      o.connect(g).connect(a.destination); o.start(s); o.stop(s + 1.3);
    });
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    try { localStorage.setItem(KEY + '.sound', soundOn ? 'on' : 'off'); } catch (e) {}
    if (soundOn) { lastTickAt = 0; tick(); }
  });

  // ---- confetti ----
  const cf = $('confetti'), cctx = cf.getContext('2d');
  let parts = [], cfRaf = 0;
  function confetti() {
    if (reduceMotion) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cf.hidden = false;
    const W = innerWidth, H = innerHeight;
    cf.width = W * dpr; cf.height = H * dpr; cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = PALETTE.concat(['#F2B544', '#F4F1EA']);
    const rect = cabinet.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height * 0.5;
    parts = Array.from({ length: 90 }, () => ({
      x: cx + (Math.random() - 0.5) * rect.width * 0.7, y: cy,
      vx: (Math.random() - 0.5) * 14, vy: -8 - Math.random() * 10,
      r: 3 + Math.random() * 4, a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.25,
      c: cols[Math.floor(Math.random() * cols.length)], life: 1
    }));
    const t0 = performance.now();
    cancelAnimationFrame(cfRaf);
    function step(now) {
      const tt = (now - t0) / 1000;
      cctx.clearRect(0, 0, W, H);
      for (const p of parts) {
        p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.a += p.va;
        p.life = Math.max(0, 1 - Math.max(0, tt - 1.5) / 0.9);
        cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.a); cctx.globalAlpha = p.life;
        cctx.fillStyle = p.c; cctx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * 0.66); cctx.restore();
      }
      if (tt < 2.5) cfRaf = requestAnimationFrame(step); else stopConfetti();
    }
    cfRaf = requestAnimationFrame(step);
  }
  function stopConfetti() { cancelAnimationFrame(cfRaf); cctx.clearRect(0, 0, cf.width, cf.height); cf.hidden = true; }

  // ---- settings panel ----
  function openPanel() { panel.hidden = false; scrim.hidden = false; renderList(); setTimeout(() => $('addInput').focus(), 60); }
  function closePanel() { panel.hidden = true; scrim.hidden = true; openTr = -1; }
  settingsBtn.addEventListener('click', openPanel);
  $('closeBtn').addEventListener('click', closePanel);
  scrim.addEventListener('click', closePanel);

  const seg = $('reelSeg');
  function renderSeg() { seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.r) === reelCount))); }
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || anySpinning()) return;
    reelCount = Number(b.dataset.r);
    try { localStorage.setItem(KEY + '.reels', String(reelCount)); } catch (e) {}
    renderSeg(); buildReels(); outcome.hidden = true;
    setHint('hintIdle', { n: reelCount });
  });

  function renderList() {
    const n = active().length;
    list.innerHTML = '';
    items.forEach((it, i) => {
      const li = document.createElement('li');
      li.className = it.on ? '' : 'off';
      const activeIdx = it.on ? active().indexOf(it) : -1;
      const col = activeIdx >= 0 ? colorAt(activeIdx, n) : 'transparent';
      const nm = nameOf(it);
      const open = openTr === i;
      li.innerHTML = `
        <div class="main">
          <label>
            <input type="checkbox" ${it.on ? 'checked' : ''} data-i="${i}">
            <span class="sw" style="background:${col};${activeIdx < 0 ? 'border:1px solid var(--line-2)' : ''}"></span>
            <span class="nm">${esc(nm)}</span>
          </label>
          <button class="mini" data-tr="${i}" aria-expanded="${open}">${esc(t('translate'))}</button>
          <button class="mini del" data-del="${i}" aria-label="${esc(t('delAria', { name: nm }))}">${esc(t('del'))}</button>
        </div>
        ${open ? `<div class="tr">${LANGS.map(l => `<span>${LANG_NAME[l]}</span><input type="text" maxlength="24" data-tl="${l}" data-ti="${i}" value="${esc(it.names[l] || '')}" placeholder="${esc(nameOf(it))}">`).join('')}</div>` : ''}`;
      list.appendChild(li);
    });
    updateMeta();
  }
  list.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.i != null) { items[el.dataset.i].on = el.checked; save(); renderList(); refreshIdleReels(); return; }
    if (el.dataset.tl) {
      const it = items[el.dataset.ti]; if (!it) return;
      const v = el.value.trim().replace(/\s+/g, ' ');
      if (v) it.names[el.dataset.tl] = v; else delete it.names[el.dataset.tl];
      if (!Object.values(it.names).some(Boolean)) it.names[lang] = el.value = nameOf(it) || '?';
      save(); refreshIdleReels();
      if (el.dataset.tl === lang) { const li = el.closest('li'); li.querySelector('.nm').textContent = nameOf(it); }
    }
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.del != null) { items.splice(Number(b.dataset.del), 1); openTr = -1; save(); renderList(); refreshIdleReels(); return; }
    if (b.dataset.tr != null) {
      const i = Number(b.dataset.tr); openTr = openTr === i ? -1 : i; renderList();
      if (openTr === i) { const inp = list.querySelector(`input[data-ti="${i}"][data-tl="${lang}"]`); if (inp) inp.focus(); }
    }
  });
  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const inp = $('addInput');
    const name = inp.value.trim().replace(/\s+/g, ' ');
    if (!name) return;
    if (items.length >= MAX) { setMsg(t('msgMax', { max: MAX })); return; }
    if (items.some(it => LANGS.some(l => (it.names[l] || '').toLowerCase() === name.toLowerCase()))) { setMsg(t('msgDup', { name })); return; }
    items.push({ names: { [lang]: name }, on: true }); save(); inp.value = '';
    openTr = items.length - 1; renderList(); refreshIdleReels();
    setMsg(t('msgAdded', { name }));
    const tr = list.querySelector(`input[data-ti="${openTr}"]`); if (tr) tr.scrollIntoView({ block: 'nearest' });
  });
  $('allOnBtn').addEventListener('click', () => { items.forEach(it => it.on = true); save(); renderList(); refreshIdleReels(); });
  $('resetBtn').addEventListener('click', () => {
    if (!confirm(t('confirmReset', { n: DEFAULT.length }))) return;
    items = DEFAULT.map(d => ({ names: { ...d }, on: true })); openTr = -1; save(); renderList(); refreshIdleReels(); setMsg(t('msgReset'));
  });
  let msgTimer = 0;
  function setMsg(s) { msg.textContent = s; clearTimeout(msgTimer); msgTimer = setTimeout(() => { msgTimer = 0; msg.textContent = t('msgDefault', { max: MAX }); }, 3200); }
  function updateMeta() { metaEl.innerHTML = t('meta', { n: active().length }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---- boot ----
  function measure() {
    rowPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row')) || 82;
    reels.forEach(render);
  }
  matchMedia('(min-width:600px)').addEventListener('change', measure);
  measure(); renderSeg(); buildReels();
  hintState = { key: 'hintIdle', params: { n: reelCount } };
  applyLang();
})();
</script>
</body>
</html>
